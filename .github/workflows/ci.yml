name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned in docs/ENVIRONMENT_v0.1.md; change both together.
  FRAPPE_VERSION: v16.55.2
  ERPNEXT_VERSION: v16.53.0

jobs:
  record-ui:
    name: Record UI build and browser flows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm install --no-package-lock
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - run: pip install playwright
      - name: Desktop and phone record flows
        run: |
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 8080 > /tmp/berjaya-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/berjaya >/dev/null && break
            sleep 1
          done
          python frontend/tests/record_operations_browser.py
  lint:
    name: Lint and pure tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check sidra_realestate

      - name: Python syntax check
        run: python -m compileall -q sidra_realestate

      - name: JSON metadata parses
        run: |
          find sidra_realestate -name "*.json" -print0 | xargs -0 -n1 python -c "import json,sys; json.load(open(sys.argv[1]))"

      - name: Pure business-rule tests (no Frappe)
        run: python -m unittest discover -s sidra_realestate -p "test_engine_*.py" -t . -v

  bench:
    name: ERPNext bench install and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MariaDB client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client

      - name: bench init (Frappe ${{ env.FRAPPE_VERSION }})
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch "$FRAPPE_VERSION" --python "$(which python)" ~/frappe-bench

      - name: Get apps (ERPNext ${{ env.ERPNEXT_VERSION }} and this app)
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch "$ERPNEXT_VERSION" --skip-assets https://github.com/frappe/erpnext
          bench get-app --skip-assets sidra_realestate "$GITHUB_WORKSPACE"
          bench setup requirements --dev

      - name: New site, install, migrate, build
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          # The contract print format uses the Chrome PDF generator; the runner image ships Chrome.
          bench set-config -g chromium_path "$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          bench new-site --db-root-password root --admin-password admin --db-host 127.0.0.1 test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app sidra_realestate
          bench --site test_site migrate
          bench --site test_site list-apps
          bench build --app sidra_realestate

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app sidra_realestate 2>&1 | tee ~/bench-tests.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-tests-log
          path: |
            ~/bench-tests.log
            /home/runner/frappe-bench/logs/frappe.testing.log
          if-no-files-found: ignore
